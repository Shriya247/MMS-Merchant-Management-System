<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMS | Admin Login</title><link rel="stylesheet" th:href="@{/css/mms-theme.css}"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#eee8ff,#fff0df,#ffe1ec);padding:20px}.login-card{width:100%;max-width:430px;background:white;padding:40px;border-radius:24px;box-shadow:0 20px 60px #6c4b9b22}.login-card .brand{margin:0 0 18px}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted);font-size:13px;line-height:1.6}.login-card label{display:block;margin:20px 0 7px;font-size:12px;font-weight:800}.login-card input,.login-card button{width:100%}.login-card button{margin-top:25px}.login-card .footer{margin-top:20px}.message{padding:12px;border-radius:10px;background:#ffe6ec;color:#b43858;font-size:12px}.message.ok{background:#e2f7ec;color:#19804c}body{background:radial-gradient(circle at 90% 5%,#ffd8d7 0,transparent 34%),radial-gradient(circle at 0 100%,#e9ddff 0,transparent 40%),#fff9f8;color:#291a43;font-family:Inter,Segoe UI,Arial,sans-serif}.login-card{max-width:460px;border:1px solid #eee2f4;border-radius:26px;padding:46px;box-shadow:0 25px 75px #50287c24}.login-card .brand{display:flex;align-items:center;gap:13px;margin-bottom:35px;color:#35195b}.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#ffb48b,#f87ca9);color:white;font-size:34px;font-weight:900}.brand strong{display:block;font-size:28px;letter-spacing:-1px}.brand small{display:block;font-size:9px;letter-spacing:1px;font-weight:800;color:#8b719e}.login-card h1{font-size:31px;letter-spacing:-1px}.login-card input{height:48px;border:1px solid #e7dcf0;border-radius:12px;padding:0 14px;background:#fcfaff}.login-card button.primary{height:48px;border:0;border-radius:12px;background:linear-gradient(100deg,#6936b5,#9855cc);color:white;font-weight:800;cursor:pointer}.login-card .footer{color:#998ba8;font-size:11px} </style></head><body><div class="login-card"><div class="brand"><span class="mark">m</span><span><strong>MMS</strong><small>MERCHANT MANAGEMENT SYSTEM</small></span></div><h1>Welcome back!</h1><p>Sign in to your Merchant Management System admin workspace.</p><div class="message" th:if="${param.error}">Invalid username or password.</div><div class="message ok" th:if="${param.logout}">You have logged out successfully.</div><form th:action="@{/login}" method="post"><label>Username</label><input name="username" type="text" autocomplete="username" required placeholder="Enter username"><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Enter password"><button class="primary" type="submit">Sign In →</button></form><p><a href="/" style="color:#7650ee;text-decoration:none">← Back to dashboard</a></p><div class="footer">MMS · Merchant Management System</div></div></body></html>
